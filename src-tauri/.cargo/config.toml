# whisper.cpp (via whisper-rs-sys) utilise std::filesystem, disponible seulement
# à partir de macOS 10.15. On fixe la cible de déploiement à 11.0 pour toute la
# compilation (scripts de build C/C++ compris). Ignoré hors macOS.
[env]
# force = true : indispensable, car le CLI Tauri exporte lui-même
# MACOSX_DEPLOYMENT_TARGET (à une valeur < 10.15) et Cargo ne surcharge pas une
# variable déjà présente dans l'environnement sans force.
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = true }
