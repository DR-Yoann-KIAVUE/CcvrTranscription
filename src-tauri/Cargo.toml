[package]
name = "ccvr-transcription"
version = "0.1.0"
description = "Dictée médicale locale"
authors = ["Cabinet Dr Kiavue Yoann"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ccvr_transcription_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
hound = "3.5"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
whisper-rs = "0.14"
thiserror = "1"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "stream", "rustls", "http2"] }
futures-util = "0.3"

[features]
# Placeholder pour d'éventuelles features (ex. accélération GPU).
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
